name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: macos-26
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if current commit already has a tag
        id: check_tag
        run: |
          git fetch --force --tags
          current_tags="$(git tag --points-at HEAD | awk '/^v[0-9]+\.[0-9]+(\.[0-9]+)?$/')"
          if [[ -n "$current_tags" ]]; then
            echo "Current commit already has release tags: $current_tags"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next version
        if: steps.check_tag.outputs.skip != 'true'
        id: version
        run: |
          latest_tag="$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+(\.[0-9]+)?$/ { print; exit }')"
          if [[ -z "$latest_tag" ]]; then
            yml_version="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml | tr -d '"')"
            latest_tag="v${yml_version:-0.1}"
            echo "No tags; using project.yml $latest_tag"
            version="${latest_tag#v}"
            new_version="$version"
            prerelease=true
          else
            echo "Latest tag: $latest_tag"
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            patch="${patch:-0}"
            patch=$((patch + 1))
            new_version="$major.$minor.$patch"
            prerelease=false
          fi

          new_tag="v$new_version"
          IFS='.' read -r major minor patch <<< "$new_version"
          patch="${patch:-0}"
          build_number="$((major * 1000000 + minor * 1000 + patch))"

          echo "New version: $new_version"
          {
            echo "version=$new_version"
            echo "tag=$new_tag"
            echo "build_number=$build_number"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Update project.yml version
        if: steps.check_tag.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $NEW_VERSION/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $NEW_BUILD/" project.yml

      - name: Create and push tag
        if: steps.check_tag.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.yml
          git diff --staged --quiet || git commit -m "chore: bump version to $NEW_TAG [skip ci]"
          git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          git fetch --force --tags
          if git rev-parse --verify --quiet "refs/tags/${NEW_TAG}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$NEW_TAG")"
            if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag ${NEW_TAG} already points to ${tag_commit}; refusing to publish a different commit."
              exit 1
            fi
          else
            git tag -a "$NEW_TAG" -m "Auto-release $NEW_TAG"
          fi
          git push --atomic origin main "$NEW_TAG"

  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag }}
      prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
    secrets: inherit

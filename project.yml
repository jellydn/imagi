name: ImageStudio
options:
  bundleIdPrefix: com.example.imagestudio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  StudioCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Image Studio
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save images you choose to your photo library.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Save images you choose to your photo library.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  StudioApp:
    type: application
    sources: [App]
    dependencies:
      - package: StudioCore
targets:
  ImageStudio-iPhone:
    templates: [StudioApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagestudio.iphone
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ImageStudio-iPad:
    templates: [StudioApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagestudio.ipad
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ImageStudio-Mac:
    templates: [StudioApp]
    platform: macOS
    dependencies:
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Configuration/Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.example.imagestudio.mac-spks
          - com.example.imagestudio.mac-spki
    settings:
      base:
        PRODUCT_NAME: ImageStudio
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagestudio.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        SPARKLE_PUBLIC_ED_KEY: HO52CC+LHhXAWKpMzuQH8ghph50xsRoN0CD9uYzhiCc=
        INFOPLIST_KEY_SUFeedURL: https://raw.githubusercontent.com/jellydn/imagi/main/appcast.xml
        INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUScheduledCheckInterval: 86400
  ImageStudio-NativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NativeTests
      - App/Models.swift
      - App/ImageStore.swift
    dependencies:
      - package: StudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.imagestudio.tests
schemes:
  ImageStudio-NativeTests:
    build:
      targets:
        ImageStudio-NativeTests: all
    test:
      targets: [ImageStudio-NativeTests]
